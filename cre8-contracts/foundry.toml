[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[profile.ci]
fuzz = { runs = 2_000 }
invariant = { runs = 500, depth = 64 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

# Fork endpoints. Values come from the environment only: never put a credential-bearing RPC URL in this file.
[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
